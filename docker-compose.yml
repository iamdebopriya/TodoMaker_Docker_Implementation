version: "3.9"

services:
  todo-postgres:
    image: debopriyalahiri/todo_implementation:postgres
    container_name: todo-postgres
    environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - todo-net

  todo-backend:
    image: debopriyalahiri/todo_implementation:backend
    container_name: todo-backend
    ports:
      - "3000:3000"
    environment:
        POSTGRES_HOST: todo-postgres
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_PORT: ${POSTGRES_PORT}
    depends_on:
      - todo-postgres
    networks:
      - todo-net

  todo-frontend:
    image: debopriyalahiri/todo_implementation:frontend
    container_name: todo-frontend
    ports:
      - "5173:5173"
    depends_on:
      - todo-backend
    networks:
      - todo-net

volumes:
  pgdata:

networks:
  todo-net:
    driver: bridge